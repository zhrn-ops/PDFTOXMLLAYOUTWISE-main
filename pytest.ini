[pytest]
testpaths = tests
qt_api = pyside6
# Fail a stuck test instead of blocking the whole run. Keep in sync with
# pyproject.toml.
timeout = 180
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: isolated unit tests for individual functions and classes
    integration: integration tests connecting multiple subsystems
    gui: graphical interface tests requiring PySide6 widgets
    schema: XML schema validation and profile tests
    scientific: chemical, physical, and medical script and symbol preservation
    recovery: crash, cancellation, and malformed state recovery
    benchmark: performance, latency, and timing measurements
    cli: headless command-line interface and batch conversion
